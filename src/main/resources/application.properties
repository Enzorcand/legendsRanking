spring.application.name=aaac-ranking

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:aaac_ranking}}
spring.datasource.username=${DATABASE_USERNAME:${POSTGRES_USER:aaac_ranking}}
spring.datasource.password=${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

riot.api-key=${RIOT_API_KEY:}
riot.platform=${RIOT_PLATFORM:br1}
riot.continent=${RIOT_CONTINENT:americas}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
mail.from=${MAIL_FROM:no-reply@aaac-ranking.pucrs.br}

logging.level.org.flywaydb=DEBUG
logging.level.org.flywaydb.core.internal.command=DEBUG
